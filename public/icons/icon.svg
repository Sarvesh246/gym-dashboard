<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050508;stop-opacity:1" />
    </linearGradient>

    <!-- Metallic bar gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e6e6f0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b3b3bf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6e6f0;stop-opacity:1" />
    </linearGradient>

    <!-- Weight plate gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#404558;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#262838;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#404558;stop-opacity:1" />
    </linearGradient>

    <!-- Collar gradient -->
    <radialGradient id="collarGrad" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d9d9e6;stop-opacity:1" />
    </radialGradient>

    <!-- Drop shadow -->
    <filter id="plateShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0.5" dy="2.5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)"/>

  <!-- Left weight plate -->
  <g filter="url(#plateShadow)">
    <rect x="21" y="60" width="26" height="48" rx="3" ry="3" fill="url(#plateGrad)" stroke="#5a5d73" stroke-width="0.8"/>
    <line x1="23" y1="70" x2="45" y2="70" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
  </g>

  <!-- Right weight plate -->
  <g filter="url(#plateShadow)">
    <rect x="145" y="60" width="26" height="48" rx="3" ry="3" fill="url(#plateGrad)" stroke="#5a5d73" stroke-width="0.8"/>
    <line x1="147" y1="70" x2="169" y2="70" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
  </g>

  <!-- Left collar -->
  <circle cx="55" cy="84" r="5.5" fill="url(#collarGrad)"/>
  <circle cx="55" cy="84" r="4.8" fill="none" stroke="#f0f0f5" stroke-width="0.4" opacity="0.6"/>

  <!-- Right collar -->
  <circle cx="137" cy="84" r="5.5" fill="url(#collarGrad)"/>
  <circle cx="137" cy="84" r="4.8" fill="none" stroke="#f0f0f5" stroke-width="0.4" opacity="0.6"/>

  <!-- Main barbell bar -->
  <g>
    <rect x="42" y="79" width="108" height="10" rx="5" ry="5" fill="url(#barGrad)"/>
    <rect x="42" y="79" width="108" height="4" rx="2" ry="2" fill="#ffffff" opacity="0.25"/>
    <line x1="52" y1="84" x2="140" y2="84" stroke="#ffffff" stroke-width="0.3" opacity="0.1"/>
  </g>

  <!-- Accent highlights on collars -->
  <ellipse cx="55" cy="77.5" rx="5.5" ry="2" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.2"/>
  <ellipse cx="137" cy="77.5" rx="5.5" ry="2" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.2"/>
</svg>
